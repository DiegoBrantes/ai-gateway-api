version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the PR list quiet: batch safe updates, and leave major bumps for a
    # manual review (some runtime deps are pinned via `overrides`, so a blind
    # major bump would break the build or re-open a patched advisory).
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(actions)

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(docker)
