services:
  gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      # Production refuses to boot with the example key — supply your own.
      API_KEYS: ${API_KEYS:?Set API_KEYS (comma-separated) in your shell or .env}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
      FALLBACK_PROVIDERS: ${FALLBACK_PROVIDERS:-anthropic,gemini}
      # No real provider keys? Set ALLOW_MOCK_PROVIDER=true to run the demo on mock.
      ALLOW_MOCK_PROVIDER: ${ALLOW_MOCK_PROVIDER:-true}
      # Dashboard/metrics are protected in production by default.
      DASHBOARD_PUBLIC: ${DASHBOARD_PUBLIC:-false}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
